[workspace]
members = ["crates/lumapaint-fonts", "crates/lumapaint-core", "crates/lumapaint-formats", "crates/lumapaint-svg", "crates/lumapaint-mcp", "crates/lumapaint-renderer", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive", "rc"] }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
svg2pdf = { path = "vendor/svg2pdf" }
block = { path = "vendor/block" }
usvg = { path = "vendor/usvg" }
simplecss = { path = "vendor/simplecss" }
freetype-sys = { path = "vendor/freetype-sys" }

# Native drawing must remain interactive in `tauri dev` as well as release builds.
[profile.dev.package.lumapaint-core]
opt-level = 2
[profile.dev.package.lumapaint-renderer]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.resvg]
opt-level = 2
