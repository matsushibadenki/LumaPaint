[package]
name = "lumapaint-formats"
version.workspace = true
edition.workspace = true

[dependencies]
lumapaint-fonts = { path = "../lumapaint-fonts" }
lumapaint-core = { path = "../lumapaint-core" }
serde.workspace = true
serde_json = "=1.0.151"
base64 = "=0.23.1"
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
usvg = "=0.48.1"
roxmltree = "=0.21.1"

svg2pdf = { version = "=0.13.0", default-features = false, features = ["image"] }
lopdf = { version = "=0.45.0", default-features = false }

sha2 = "=0.11.0"
ttf-parser = "=0.25.1"
freetype-rs = { version = "=0.38.0", features = ["bundled"] }
