[package]
name = "lumapaint-formats"
version.workspace = true
edition.workspace = true

[dependencies]
lumapaint-core = { path = "../lumapaint-core" }
serde.workspace = true
serde_json = "1"
base64 = "0.22"
crc32fast = "1"
flate2 = "=1.1.10"
png = "=0.18.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
usvg = "0.45"
roxmltree = "0.20"

svg2pdf = { version = "=0.13.0", default-features = false, features = ["image"] }
lopdf = { version = "=0.45.0", default-features = false }

sha2 = "0.11"
ttf-parser = "=0.25.1"
