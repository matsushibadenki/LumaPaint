[package]
name = "edfx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
rustybuzz = "=0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-linebreak = "=0.1.5"
unicode-script = "0.5"
kurbo = "0.13"

[dev-dependencies]
resvg = { version = "=0.49.0", default-features = false }
