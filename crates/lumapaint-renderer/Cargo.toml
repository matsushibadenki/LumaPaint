[package]
name = "lumapaint-renderer"
version.workspace = true
edition.workspace = true

[features]
default = []
skia = ["dep:skia-safe", "dep:metal"]

[dependencies]
serde.workspace = true
lumapaint-fonts = { path = "../lumapaint-fonts" }
pollster = "0.4"
i_overlay = "=9.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lumapaint-core = { path = "../lumapaint-core" }
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
resvg = "0.45"
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-segmentation = "1.13"
skia-safe = { version = "=0.153.3", features = ["svg", "webp"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "=0.153.3", features = ["svg", "webp", "metal", "ganesh"], optional = true }
metal = { version = "0.32", optional = true }

[dev-dependencies]
lopdf = { version = "=0.45.0", default-features = false }
base64 = "0.22"
png = "=0.18.1"
serde_json = "1"
lumapaint-formats = { path = "../lumapaint-formats" }
lumapaint-svg = { path = "../lumapaint-svg" }
pollster = "0.4"
