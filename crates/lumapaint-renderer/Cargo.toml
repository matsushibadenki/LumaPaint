[package]
name = "lumapaint-renderer"
version.workspace = true
edition.workspace = true

[features]
default = []
skia = ["dep:skia-safe"]

[dependencies]
lumapaint-core = { path = "../lumapaint-core" }
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
resvg = "0.45"
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-segmentation = "1.13"
# This CPU/SVG/WebP combination has upstream prebuilt binaries for Apple Silicon.
skia-safe = { version = "=0.153.3", features = ["svg", "webp"], optional = true }

[dev-dependencies]
pollster = "0.4"
