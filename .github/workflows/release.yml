name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-state:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          PUBLISHED=$(jq --arg tag "v$VERSION" 'any(.[]; .tag_name == $tag and .draft == false)' "$RUNNER_TEMP/releases.json")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: [checks, release-state]
    if: needs.release-state.outputs.published != 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Validate release version and signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          python3 scripts/check-release-version.py
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: LumaPaint __VERSION__
          releaseBody: |
            Software Update is now available from the LumaPaint menu (English / 日本語 / 简体中文).
            Signed updates preserve documents and refuse installation while unsaved changes remain.
            Includes SVG GPU rendering and node-drag performance improvements.

            macOS Apple Silicon. Install 0.0.2 manually once when upgrading from 0.0.1; subsequent versions can use in-app updates.
          releaseDraft: true
          uploadUpdaterJson: false
          args: --target aarch64-apple-darwin --bundles app,dmg
      - name: Publish validated update manifest to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          DIR="$RUNNER_TEMP/lumapaint-update"
          mkdir -p "$DIR"
          gh release view "$TAG" --json assets,body,isDraft > "$DIR/release.json"
          jq -e '.isDraft' "$DIR/release.json" > /dev/null
          ARCHIVE=$(jq -er '[.assets[].name | select(endswith("_aarch64.app.tar.gz"))] | select(length == 1) | first' "$DIR/release.json")
          gh release download "$TAG" --pattern "$ARCHIVE.sig" --dir "$DIR"
          jq --arg version "$VERSION" --rawfile signature "$DIR/$ARCHIVE.sig" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ARCHIVE" \
            '{version: $version, notes: .body, pub_date: (now | todateiso8601),
              platforms: ({"darwin-aarch64": {url: $url, signature: ($signature | rtrimstr("\n"))}}
                | .["darwin-aarch64-app"] = .["darwin-aarch64"])}' \
            "$DIR/release.json" > "$DIR/latest.json"
          python3 scripts/check-update-manifest.py "$DIR/latest.json"
          gh release upload "$TAG" "$DIR/latest.json" --clobber
