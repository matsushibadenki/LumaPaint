[package]
name = "lumapaint"
version.workspace = true
edition.workspace = true
description = "Non-destructive illustration, comics, and animation workspace"

[lib]
name = "lumapaint_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unicode-segmentation = "1.13"
lumapaint-fonts = { path = "../crates/lumapaint-fonts" }
base64 = "0.22"
lumapaint-renderer = { path = "../crates/lumapaint-renderer" }
lumapaint-formats = { path = "../crates/lumapaint-formats" }
lumapaint-svg = { path = "../crates/lumapaint-svg" }
tauri = { version = "~2.12.1", features = [] }
lumapaint-core = { path = "../crates/lumapaint-core" }
serde.workspace = true
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
lumapaint-renderer = { path = "../crates/lumapaint-renderer", features = ["skia"] }
pollster = "0.4"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["objc2-core-graphics", "std", "NSView", "NSPasteboard", "NSWindow", "NSResponder", "NSEvent", "NSApplication", "NSColor", "NSCursor", "NSGraphics", "NSScreen", "NSControl", "NSCell", "NSButton", "NSButtonCell", "NSImage", "NSText", "NSTextView", "NSTextContainer", "NSTextStorage", "NSFont", "NSFontManager", "NSParagraphStyle", "NSAttributedString", "NSTextInputClient", "NSLayoutManager", "NSTextList"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSData", "NSDate", "NSRunLoop", "NSString", "NSRange", "NSArray", "NSDictionary", "NSAttributedString", "NSValue", "NSUndoManager"] }
rfd = "0.17.2"
